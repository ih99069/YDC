<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Diet Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">다이어트 식단 관리</p>
          <h1>Health Tracker</h1>
        </div>
        <div class="target-badge">
          <span>목표</span>
          <strong>1,800 kcal</strong>
        </div>
      </header>

      <main class="content-grid">
        <section class="panel overview-panel">
          <div class="panel-header">
            <h2>오늘의 요약</h2>
            <button class="ghost-btn" id="resetDataBtn">초기화</button>
          </div>

          <div class="stats-grid">
            <article class="stat-card accent">
              <span>섭취 칼로리</span>
              <strong id="totalCalories">0 kcal</strong>
            </article>
            <article class="stat-card">
              <span>단백질</span>
              <strong id="totalProtein">0 g</strong>
            </article>
            <article class="stat-card">
              <span>수분</span>
              <strong id="waterAmount">0 L</strong>
            </article>
            <article class="stat-card">
              <span>남은 칼로리</span>
              <strong id="remainingCalories">1,800 kcal</strong>
            </article>
          </div>

          <div class="progress-box">
            <div class="progress-label-wrap">
              <span>오늘의 식단 달성률</span>
              <strong id="progressPercent">0%</strong>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </section>

        <section class="panel form-panel">
          <div class="panel-header">
            <h2>식단 추가</h2>
          </div>

          <form id="mealForm">
            <div class="field-row two-col">
              <label>
                <span>음식명</span>
                <input type="text" id="foodName" placeholder="예: 닭가슴살 샐러드" required />
              </label>
              <label>
                <span>분류</span>
                <select id="mealType">
                  <option value="아침">아침</option>
                  <option value="점심">점심</option>
                  <option value="저녁">저녁</option>
                  <option value="간식">간식</option>
                </select>
              </label>
            </div>

            <div class="field-row three-col">
              <label>
                <span>칼로리</span>
                <input type="number" id="calories" min="0" placeholder="kcal" required />
              </label>
              <label>
                <span>단백질</span>
                <input type="number" id="protein" min="0" placeholder="g" required />
              </label>
              <label>
                <span>수분</span>
                <input type="number" id="water" min="0" step="0.1" placeholder="L" />
              </label>
            </div>

            <button type="submit" class="primary-btn">식단 등록</button>
          </form>
        </section>

        <section class="panel water-panel">
          <div class="panel-header">
            <h2>물 섭취</h2>
          </div>

          <div class="water-ui">
            <div class="water-bottle">
              <div class="water-fill" id="waterFill"></div>
            </div>
            <div class="water-actions">
              <button class="small-btn" id="addWaterBtn">+ 0.5L</button>
              <button class="small-btn secondary" id="removeWaterBtn">- 0.5L</button>
            </div>
          </div>
        </section>

        <section class="panel list-panel">
          <div class="panel-header">
            <h2>오늘의 식단 기록</h2>
          </div>
          <ul id="mealList" class="meal-list"></ul>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
